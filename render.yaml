services:
  - name: ski-lab-api
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ski_optimizer.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Enter these yourself in the Render dashboard after the first
      # deploy (sync: false means Render won't overwrite/generate them --
      # they must be set manually, and are never stored in this file or
      # in git). Generate SECRET_KEY with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Render's default Python version depends on when the service was
      # first created (pre-existing services can default to something
      # much older, per Render's own docs) -- pinned explicitly because
      # requirements.txt's fast-flights (live flight pricing, see
      # adapters/google_flights_adapter.py) REQUIRES >= 3.10 and would
      # otherwise fail to install on an older default, silently breaking
      # the whole deploy rather than just flight pricing.
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./ski_lab.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: EMAIL_BACKEND
        value: console
      # Used for CORS allow-listing (see api/main.py) -- comma-separated,
      # must exactly match the frontend's actual deployed URL(s), scheme
      # included. The Render static site below is kept as a fallback;
      # ski-lab-app.web.app (Firebase Hosting, see firebase.json) is the
      # primary deploy, auto-published from GitHub on push to main.
      - key: FRONTEND_URL
        value: https://ski-lab-app.web.app,https://ski-lab-app.onrender.com
      # From a Google Cloud Console OAuth 2.0 Client ID (Web application
      # type) -- doesn't exist yet, enter these in the Render dashboard
      # once it does (see .env.example for the full setup note). Google
      # sign-in returns a clean 503 ("not configured yet") until both
      # are set, it doesn't break anything else.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match the redirect URI registered in Google Cloud
      # Console, including scheme. Fixed here (not sync: false) since
      # it's not a secret -- just the API's own real callback URL.
      - key: GOOGLE_REDIRECT_URI
        value: https://ski-lab-api.onrender.com/auth/google/callback

  - name: ski-lab-app
    type: web
    runtime: static
    # No `plan` field here -- Render rejected "free" for a static site
    # ("no such plan free for service type web") when this was first
    # tried live. Static sites are served over Render's CDN with no
    # paid-tier compute concept the way web services have, so the field
    # doesn't apply; omitting it is the fix, not a different plan value.
    #
    # This builds the real Next.js app in frontend/web (see its own
    # README). The earlier plain-HTML page (frontend/app) and the
    # JS-engine-port demo (frontend/prototype) that predated it are
    # deleted -- this is the only frontend now. `next build` with
    # `output: "export"` in next.config.ts produces static HTML/CSS/JS
    # in frontend/web/out, which is what gets published.
    buildCommand: cd frontend/web && npm ci && npm run build
    staticPublishPath: frontend/web/out
